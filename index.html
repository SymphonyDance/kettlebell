<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kettlebell">
<meta name="theme-color" content="#f3f2f2">
<title>Kettlebell — Weekly Session</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --text:#201e1d;
  --accent:#ec3013; --accent-600:#dd2b0f; --accent-700:#ae1800;
  --divider: rgba(32,30,29,0.4);
  --n100:#f8f4f4; --n200:#eae7e7; --n300:#d7d3d3; --n400:#bab6b6;
  --n500:#9b9797; --n600:#7d7979; --n700:#605d5d; --n800:#444141; --n900:#2d2b2b;
  --font: "Archivo", system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
::selection{background:rgba(236,48,19,.18);}
a{color:var(--accent-700);} a:hover{color:var(--accent);}
.wrap{max-width:760px;margin:0 auto;padding:0 24px 148px;overflow-x:hidden;}
.hr{border:none;border-top:2px solid var(--divider);margin:0;}

header{display:flex; justify-content:space-between; align-items:baseline; padding:26px 0 12px; border-bottom:2px solid var(--divider);}
.eyebrow{margin:0 0 6px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent-700); font-weight:600;}
h1{margin:0; font-size:34px; line-height:1; letter-spacing:-.01em; text-transform:uppercase; font-weight:800;}
.datestamp{margin:0; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--n600); font-weight:600;}

/* PROGRAM PICKER */
.prog-pick{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); border-bottom:2px solid var(--divider);}
.prog-opt{
  border:none; background:none; cursor:pointer; text-align:left;
  padding:16px 0; color:var(--n600); border-bottom:4px solid transparent;
  transition:color .15s ease, border-color .15s ease;
}
.prog-opt + .prog-opt{padding-left:20px; border-left:2px solid var(--divider);}
.prog-opt-name{margin:0 0 3px; font-size:19px; font-weight:800; text-transform:uppercase; letter-spacing:-.005em; line-height:1;}
.prog-opt-sub{margin:0; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600;}
.prog-opt:hover{color:var(--text);}
.prog-opt.on{color:var(--text); border-bottom-color:var(--accent);}
.prog-opt.on .prog-opt-sub{color:var(--accent-700);}

.stat-row{display:grid; grid-template-columns:repeat(3,1fr); border-bottom:2px solid var(--divider);}
.stat{padding:20px 0;}
.stat + .stat{padding-left:20px; border-left:2px solid var(--divider);}
.stat-label{margin:0 0 4px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.stat-val{margin:0; font-size:28px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
.stat-val small{font-size:16px; font-weight:600; color:var(--n500);}

.section-label{margin:26px 0 0; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.pair-label{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  margin:24px 0 0; padding:0 0 8px; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent-700); font-weight:700;
}
.pair-label span:last-child{color:var(--n600); font-weight:600; letter-spacing:.1em;}
.resume-note{
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  margin:20px 0 0; padding:14px 16px; background:var(--n200); border-left:6px solid var(--accent);
}
.resume-note p{margin:0; font-size:13px; line-height:1.4; color:var(--n800);}
.resume-note strong{font-weight:800;}
.text-btn{
  border:none; background:none; padding:0; cursor:pointer; white-space:nowrap;
  font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--n600); font-weight:700;
}
.text-btn:hover{color:var(--accent);}

.howto-link{
  display:inline-flex; align-items:center; gap:8px; margin-top:18px;
  border:none; background:none; padding:0; cursor:pointer;
  font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-700); font-weight:700;
}
.howto-link:hover{color:var(--accent);}

.row, .video-row{
  display:grid; grid-template-columns:34px 76px minmax(0,1fr) auto;
  align-items:center; gap:16px; padding:18px 0; border-top:2px solid var(--divider);
  opacity:0; animation:rowIn .38s cubic-bezier(.2,.8,.2,1) both;
  text-align:left; text-decoration:none; color:inherit;
  width:100%; background:none; border-left:none; border-right:none; border-bottom:none; cursor:pointer;
  transition:background .15s ease;
}
.row:hover, .video-row:hover{background:var(--n100);}
@keyframes rowIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.row-num{margin:0; font-size:15px; font-weight:800;}
.row-art, .video-row-art{height:74px; display:flex; align-items:center; justify-content:center; background:var(--n100);}
.row-name, .video-row-name{margin:0 0 3px; font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:-.005em; line-height:1.1;}
.row-scheme, .video-row-sub{margin:0 0 7px; font-size:13px; color:var(--n600);}
.video-row-sub{margin-bottom:0;}
.row-tags{display:flex; gap:6px; flex-wrap:wrap;}
.tag-outline{
  display:inline-block; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  padding:3px 7px; border:1.5px solid var(--n400); color:var(--n700); font-weight:600;
}
.tag-load{border-color:var(--accent); color:var(--accent-700);}
.row-state{margin:0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; white-space:nowrap;}
.video-row-play{
  width:40px; height:40px; flex:none; background:var(--accent);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px;
}
.footnote{margin:24px 0 0; font-size:12px; line-height:1.6; color:var(--n600); max-width:46ch; text-wrap:pretty;}

/* STICKY ACTION BAR */
.sticky-cta{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding:14px 24px calc(14px + env(safe-area-inset-bottom));
  background:var(--bg); border-top:2px solid var(--divider);
  transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
}
.sticky-cta.hidden{transform:translateY(130%); opacity:0; pointer-events:none;}
.sticky-cta-inner{max-width:760px; margin:0 auto; display:grid; gap:10px;}
.cta-hint{margin:0 0 2px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--n600); font-weight:700;}
.btn{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  padding:18px 20px; border:none; cursor:pointer;
  font-size:17px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-600);}
.btn-primary:active{background:var(--accent-700);}
.btn-outline{background:transparent; color:var(--text); border:2px solid var(--n300); justify-content:center;}
.btn-outline:hover{border-color:var(--text);}
.btn-dark{background:var(--text); color:var(--bg);}
.btn-dark:hover{background:var(--n800);}
.btn-sm{padding:14px 16px; font-size:14px;}

.sess-top{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 0; border-bottom:2px solid var(--divider);}
.exit-link{
  border:none; background:none; padding:0; cursor:pointer;
  font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--n600); font-weight:600;
}
.exit-link:hover{color:var(--accent);}
.sess-meta{display:flex; gap:18px; align-items:baseline;}
.sess-meta p{margin:0;}
.sess-label{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.sess-clock{font-size:20px; font-weight:800; letter-spacing:.02em; font-variant-numeric:tabular-nums;}
.progress-track{height:6px; background:var(--n200);}
.progress-fill{height:100%; background:var(--accent); transition:width .45s cubic-bezier(.2,.8,.2,1);}

.stage{animation:stageIn .34s cubic-bezier(.2,.8,.2,1) both;}
@keyframes stageIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
.stage.slide-fwd{animation:slideFwd .38s cubic-bezier(.2,.8,.2,1) both;}
@keyframes slideFwd{from{opacity:0; transform:translateX(28px);} to{opacity:1; transform:none;}}
.stage.slide-back{animation:slideBack .34s cubic-bezier(.2,.8,.2,1) both;}
@keyframes slideBack{from{opacity:0; transform:translateX(-28px);} to{opacity:1; transform:none;}}

.stage-head{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:end; padding:22px 0 18px; border-bottom:2px solid var(--divider);}
.stage-eyebrow{margin:0 0 8px; display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent-700); font-weight:700;}
.step-btn{
  width:30px; height:30px; flex:none; border:2px solid var(--n300); background:transparent; color:var(--text);
  font-size:14px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.step-btn:hover:not(:disabled){border-color:var(--text);}
.step-btn:disabled{opacity:.35; cursor:default;}
.stage-name{margin:0; font-size:min(40px,9vw); line-height:.98; letter-spacing:-.015em; text-transform:uppercase; font-weight:800;}
.stage-scheme{margin:0; font-size:26px; font-weight:700; white-space:nowrap;}

.stage-visual{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,190px); border-bottom:2px solid var(--divider);}
.stage-art{display:flex; align-items:center; justify-content:center; padding:20px 0; background:var(--n100);}
.stage-side{display:flex; gap:14px; align-items:center; padding:20px 0 20px 20px; border-left:2px solid var(--divider); flex-wrap:wrap;}
.mlabel{margin:0 0 4px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.mname{margin:0; font-size:16px; font-weight:700; text-transform:uppercase; line-height:1.15;}

/* SUPERSET PARTNER */
.partner{
  display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:14px; align-items:center;
  width:100%; text-align:left; cursor:pointer; color:inherit;
  padding:14px 0; margin-top:0; background:none;
  border:none; border-bottom:2px solid var(--divider);
  transition:background .15s ease;
}
.partner:hover{background:var(--n100);}
.partner-art{height:56px; background:var(--n100); display:flex; align-items:center; justify-content:center;}
.partner-label{margin:0 0 3px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.partner-name{margin:0; font-size:15px; font-weight:700; text-transform:uppercase; line-height:1.15;}
.partner-dots{display:flex; gap:4px; flex:none;}
.partner-dot{width:14px; height:14px; border:2px solid var(--n300);}
.partner-dot.filled{background:var(--accent); border-color:var(--accent);}

.load-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center; padding:16px 0; border-bottom:2px solid var(--divider);}
.load-val{margin:0; font-size:26px; font-weight:800; font-variant-numeric:tabular-nums;}
.load-val span{font-size:15px; font-weight:600; color:var(--n500);}
.load-last{margin:4px 0 0; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.load-steppers{display:flex; flex-direction:column; gap:10px; align-items:flex-end;}
.load-steppers .step-btn{width:44px; height:44px; font-size:18px;}
.load-ctl{display:flex; align-items:center; gap:10px;}
.load-side{width:12px; font-size:11px; font-weight:800; color:var(--n500); letter-spacing:.1em;}
.load-ctl .load-val{min-width:74px; text-align:center;}
.rate-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 0; border-bottom:2px solid var(--divider);}
.rate-name{margin:0; font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:-.005em;}
.rate-opts{display:flex; gap:6px;}
.rate-opt{
  border:2px solid var(--n300); background:transparent; color:var(--n600); cursor:pointer;
  padding:9px 12px; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
}
.rate-opt:hover{border-color:var(--text); color:var(--text);}
.rate-opt.on{background:var(--text); border-color:var(--text); color:var(--bg);}
.spark{display:flex; align-items:flex-end; gap:6px; height:130px; padding:22px 0 0; border-bottom:2px solid var(--divider);}
.spark-col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%;}
.spark-bar{width:100%; background:var(--accent); min-height:4px;}
.spark-bar.dim{background:var(--n300);}
.a2hs{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center;
  margin:20px 0 0; padding:14px 16px; border:2px solid var(--n300);
}
.a2hs p{margin:0; font-size:12.5px; line-height:1.45; color:var(--n800);}
.a2hs strong{font-weight:800;}
.warm{border-bottom:2px solid var(--divider);}
.warm-head{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center;
  width:100%; padding:18px 0; background:none; border:none; cursor:pointer;
  text-align:left; color:inherit; transition:background .15s ease;
}
.warm-head:hover{background:var(--n100);}
.warm-title{margin:0 0 3px; font-size:17px; font-weight:800; text-transform:uppercase; letter-spacing:-.005em; line-height:1;}
.warm-sub{margin:0; font-size:12px; color:var(--n600);}
.warm-chev{font-size:15px; font-weight:800; color:var(--n500);}
.warm-body[hidden]{display:none;}
.warm-body{padding:0 0 18px;}
.warm-item{
  display:grid; grid-template-columns:26px minmax(0,1fr) auto; gap:12px; align-items:baseline;
  padding:11px 0; border-top:2px solid var(--n200);
}
.warm-n{margin:0; font-size:12px; font-weight:800; color:var(--accent);}
.warm-name{margin:0; font-size:14px; font-weight:700; line-height:1.3;}
.warm-note{margin:2px 0 0; font-size:12.5px; line-height:1.4; color:var(--n600); text-wrap:pretty;}
.warm-dose{margin:0; font-size:12px; font-weight:700; color:var(--n700); white-space:nowrap; font-variant-numeric:tabular-nums;}
.warm-foot{margin:14px 0 0; font-size:12px; line-height:1.55; color:var(--n600); text-wrap:pretty;}
.update-toast{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  padding:14px 24px calc(14px + env(safe-area-inset-bottom));
  background:var(--text); color:var(--bg);
  animation:toastIn .32s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes toastIn{from{transform:translateY(120%);} to{transform:none;}}
.update-toast-inner{
  max-width:760px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) auto auto;
  gap:16px; align-items:center;
}
.update-toast p{margin:0; font-size:13px; font-weight:600; line-height:1.35;}
.update-toast button{
  border:none; background:none; padding:0; cursor:pointer; white-space:nowrap;
  font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--bg);
}
.update-toast button.go{color:#fff; background:var(--accent); padding:11px 14px;}
.update-toast button.go:hover{background:var(--accent-600);}
.update-toast button.later{color:rgba(243,242,242,.6);}
.update-toast button.later:hover{color:var(--bg);}
.sync-line{
  display:flex; align-items:center; gap:8px; margin:18px 0 0;
  font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--n500); font-weight:700;
}
.sync-dot{width:8px; height:8px; flex:none; background:var(--n400);}
.sync-line.ok .sync-dot{background:var(--accent);}
.sync-line.wait .sync-dot{background:var(--n500); animation:syncPulse 1.2s ease-in-out infinite;}
@keyframes syncPulse{0%,100%{opacity:1} 50%{opacity:.25}}
.code-box{margin:22px 0 0; padding:18px 18px 16px; border:2px solid var(--n300);}
.code-box .mlabel{margin-bottom:8px;}
.code-val{
  margin:0; font-size:26px; font-weight:800; letter-spacing:.14em;
  font-variant-numeric:tabular-nums; word-break:break-all;
}
.code-copy{margin:10px 0 0; font-size:12.5px; line-height:1.5; color:var(--n700); text-wrap:pretty;}
.code-actions{display:flex; gap:18px; margin:14px 0 0;}
.code-form[hidden]{display:none;}
.code-form{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; margin:14px 0 0;}
.code-input{
  border:2px solid var(--n300); background:var(--bg); color:var(--text);
  padding:12px 14px; font-family:inherit; font-size:16px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; min-width:0;
}
.code-input:focus{border-color:var(--text); outline:none;}

.cue{display:grid; grid-template-columns:32px 1fr; gap:12px; padding:14px 0; border-bottom:2px solid var(--divider);}
.cue-n{margin:0; font-size:13px; font-weight:800; color:var(--accent);}
.cue-text{margin:0; font-size:14.5px; line-height:1.45; color:var(--n800); text-wrap:pretty;}

.set-row{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 0 4px; flex-wrap:wrap;}
.set-dots{display:flex; gap:8px; flex-wrap:wrap;}
.set-pair{display:flex; gap:4px; padding-right:8px;}
.set-dot{
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:700; border:2px solid var(--n300); color:var(--n500);
  background:transparent; cursor:pointer; transition:transform .15s ease;
}
.set-dot.filled{background:var(--accent); color:#fff; border-color:var(--accent);}
.set-dot.current{border-color:var(--text); color:var(--text);}
.set-dot.pop{animation:dotPop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes dotPop{0%{transform:scale(1);} 45%{transform:scale(1.28);} 100%{transform:scale(1);}}
.sets-line{margin:0; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.dots-hint{margin:8px 0 0; font-size:11px; color:var(--n500);}
.stage-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 0 0; border-top:2px solid var(--divider); margin-top:16px;}

/* REST */
.rest{animation:stageIn .34s cubic-bezier(.2,.8,.2,1) both; padding:26px 0 0;}
.rest-banner{background:var(--accent); color:#fff; padding:26px 26px 24px; transition:background .3s ease;}
.rest-banner.urgent{background:var(--accent-700);}
.rest-eyebrow{margin:0 0 4px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; opacity:.85; font-weight:700;}
.rest-clock{margin:0; font-size:min(112px,26vw); line-height:.86; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
.rest-track{height:6px; background:rgba(255,255,255,.3); margin:22px 0 0;}
.rest-fill{height:100%; background:#fff; transition:width .9s linear;}
.rest-next{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center; padding:18px 0; border-bottom:2px solid var(--divider);}
.rest-next-name{margin:0; font-size:22px; font-weight:700; text-transform:uppercase; line-height:1.1;}
.rest-preview{display:grid; grid-template-columns:96px minmax(0,1fr); gap:18px; align-items:center; padding:18px 0; border-bottom:2px solid var(--divider);}
.rest-preview-art{background:var(--n100); height:96px; display:flex; align-items:center; justify-content:center;}
.rest-cue{margin:0; font-size:14px; line-height:1.5; color:var(--n800); text-wrap:pretty;}

/* FINISHED */
.finished{animation:finIn .5s cubic-bezier(.2,.8,.2,1) both; padding:30px 0 0;}
@keyframes finIn{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;}}
.fin-banner{background:var(--accent); color:#fff; padding:34px 26px; transform-origin:left; animation:finBanner .55s cubic-bezier(.2,.8,.2,1) both .08s;}
@keyframes finBanner{from{transform:scaleX(0);} to{transform:scaleX(1);}}
.fin-eyebrow{margin:0 0 10px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; opacity:.85; font-weight:700;}
.fin-title{margin:0; font-size:min(64px,13vw); line-height:.9; letter-spacing:-.03em; text-transform:uppercase; font-weight:800;}
.fin-sub{margin:14px 0 0; font-size:13px; letter-spacing:.02em; opacity:.9; font-weight:600;}
.fin-stats{display:grid; grid-template-columns:repeat(3,1fr);}
.fin-stat{padding:22px 0; border-bottom:2px solid var(--divider);}
.fin-stat + .fin-stat{padding-left:20px; border-left:2px solid var(--divider);}
.fin-stat-label{margin:0 0 4px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.fin-stat-val{margin:0; font-size:32px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
.fin-stat-val small{font-size:15px; font-weight:600; color:var(--n500);}
.fin-log{width:100%; border-collapse:collapse; margin-top:6px;}
.fin-log td{padding:12px 0; border-bottom:2px solid var(--divider); font-size:14px; vertical-align:baseline;}
.fin-log td:first-child{font-weight:700; text-transform:uppercase; letter-spacing:-.005em;}
.fin-log td:last-child{text-align:right; font-variant-numeric:tabular-nums; color:var(--n700); white-space:nowrap;}
.fin-copy{margin:24px 0 22px; font-size:14px; line-height:1.5; color:var(--n700); max-width:44ch; text-wrap:pretty;}
.hist-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:2px solid var(--divider); font-size:13px;}
.hist-row span:last-child{color:var(--n600); font-variant-numeric:tabular-nums;}

/* ILLUSTRATIONS */
.ill{width:100%; display:flex;}
.ill svg{width:100%; height:auto; overflow:visible;}
.ill path{fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round;}
.ill circle{fill:currentColor;}
.ill .sil{color:var(--text);}
.ill .gh{color:var(--n300);}
.ill .trunk{stroke-width:21;}
.ill .thigh{stroke-width:16;}
.ill .shin{stroke-width:13;}
.ill .uarm{stroke-width:12;}
.ill .farm{stroke-width:10;}
.ill .kb{color:var(--accent);}
.ill .gh .kb{color:var(--n300);}
.ill .kb .bar{stroke-width:5;}
.ill .kb rect{fill:currentColor; stroke:none;}
.ill .cbl{color:var(--n400); stroke-width:2.5; stroke-dasharray:none;}
.ill .gh .cbl{color:var(--n300);}
.ill .arc{color:var(--accent); stroke-width:3.5; stroke-dasharray:9 7; animation:flow 1.1s linear infinite;}
.ill .arw{color:var(--accent); stroke-width:3;}
.ill .gnd{stroke:var(--n300); stroke-width:2;}
.ill.on-accent .sil{color:#fff;} .ill.on-accent .gh{color:rgba(255,255,255,.35);}
.ill.on-accent .kb{color:#fff;} .ill.on-accent .arc, .ill.on-accent .arw{color:rgba(255,255,255,.7);}
.ill.on-accent .gnd{stroke:rgba(255,255,255,.4);}
@keyframes flow{to{stroke-dashoffset:-32;}}
@keyframes fr{0%,8.1%{opacity:1} 8.4%,100%{opacity:0}}
.ill .fr{opacity:0; animation:fr 1.7s linear infinite;}
@media (prefers-reduced-motion: reduce){
  .ill .fr:not(:last-of-type){display:none;}
  .ill .fr:last-of-type{opacity:1; animation:none;}
  .ill .arc{animation:none;}
  .row, .stage, .rest, .finished, .fin-banner{animation:none !important; opacity:1 !important;}
}

/* ---------- ILLUSTRATION ---------- */
const PT = a => a[0]+' '+a[1];
const R2 = n => Math.round(n*10)/10;
function kettle(p){
  return '<g class="kb"><path class="bar" d="M'+R2(p[0]-7)+' '+R2(p[1]-7)+' q7 -11 14 0"/><circle cx="'+R2(p[0])+'" cy="'+R2(p[1]+3)+'" r="9"/></g>';
}
function barbell(p){
  const x = R2(p[0]), y = R2(p[1]);
  return '<g class="kb"><path class="bar" d="M'+R2(x-24)+' '+y+' L'+R2(x+24)+' '+y+'"/>'
    + '<rect x="'+R2(x-29)+'" y="'+R2(y-10)+'" width="6" height="20"/>'
    + '<rect x="'+R2(x+23)+'" y="'+R2(y-10)+'" width="6" height="20"/></g>';
}
function dumbbell(p){
  const x = R2(p[0]), y = R2(p[1]);
  return '<g class="kb"><path class="bar" d="M'+R2(x-8)+' '+y+' L'+R2(x+8)+' '+y+'"/>'
    + '<rect x="'+R2(x-12)+'" y="'+R2(y-7)+'" width="5" height="14"/>'
    + '<rect x="'+R2(x+7)+'" y="'+R2(y-7)+'" width="5" height="14"/></g>';
}
function gripbar(p){
  const x = R2(p[0]), y = R2(p[1]);
  return '<g class="kb"><path class="bar" d="M'+R2(x-16)+' '+y+' L'+R2(x+16)+' '+y+'"/></g>';
}
function limbs(j){
  let s = '';
  if(j.cable) s += '<path class="cbl" d="M'+PT([R2(j.cable[0][0]),R2(j.cable[0][1])])+' L'+PT([R2(j.cable[1][0]),R2(j.cable[1][1])])+'"/>';
  s += '<path class="trunk" d="M'+PT(j.neck)+' L'+PT(j.hip)+'"/>';
  (j.legs||[]).forEach(l => { s += '<path class="thigh" d="M'+PT(j.hip)+' L'+PT(l[0])+'"/><path class="shin" d="M'+PT(l[0])+' L'+PT(l[1])+'"/>'; });
  (j.arms||[]).forEach(a => { s += '<path class="uarm" d="M'+PT(j.sh)+' L'+PT(a[0])+'"/><path class="farm" d="M'+PT(a[0])+' L'+PT(a[1])+'"/>'; });
  s += '<circle cx="'+R2(j.head[0])+'" cy="'+R2(j.head[1])+'" r="10"/>';
  if(j.bell) s += kettle(j.bell);
  if(j.bar) s += barbell(j.bar);
  if(j.grip) s += gripbar(j.grip);
  (j.dbs||[]).forEach(d => { s += dumbbell(d); });
  return s;
}
const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
function mix(g,s,t){
  const o = {neck:lerp(g.neck,s.neck,t), hip:lerp(g.hip,s.hip,t), sh:lerp(g.sh,s.sh,t), head:lerp(g.head,s.head,t)};
  o.legs = (s.legs||[]).map((l,i)=> l.map((pt,k)=> lerp((g.legs[i]||l)[k], pt, t)));
  o.arms = (s.arms||[]).map((a,i)=> a.map((pt,k)=> lerp((g.arms[i]||a)[k], pt, t)));
  if(s.bell) o.bell = lerp(g.bell||s.bell, s.bell, t);
  if(s.bar)  o.bar  = lerp(g.bar||s.bar, s.bar, t);
  if(s.grip) o.grip = lerp(g.grip||s.grip, s.grip, t);
  if(s.dbs)  o.dbs  = s.dbs.map((d,i)=> lerp((g.dbs||s.dbs)[i]||d, d, t));
  if(s.cable) o.cable = s.cable.map((pt,i)=> lerp(((g.cable||s.cable)[i])||pt, pt, t));
  return o;
}
const TS = [0,1/6,2/6,3/6,4/6,5/6,1,5/6,4/6,3/6,2/6,1/6];
function art(p, compact){
  const d = (p.dur || 1.7) * 2;
  let frames = '';
  TS.forEach((t,i)=>{
    frames += '<g class="sil fr" style="animation-duration:'+d+'s;animation-delay:'+(d*i/TS.length).toFixed(3)+'s">'+limbs(mix(p.ghost,p.solid,t))+'</g>';
  });
  return '<line class="gnd" x1="16" y1="133" x2="114" y2="133"/>' + (p.extra||'')
    + (compact ? '' : '<g class="gh">'+limbs(p.ghost)+'</g>')
    + frames
    + (p.arc ? '<path class="arc" d="'+p.arc+'"/>' : '')
    + (p.arrow ? '<path class="arw" d="'+p.arrow+'"/>' : '');
}
const svgWrap = (inner, cls) => '<div class="ill '+(cls||'')+'"><svg viewBox="0 0 130 140" aria-hidden="true"><g>'+inner+'</g></svg></div>';

/* Kettlebell keeps its original key names so existing logs survive. */
const KEYS = p => p === 'kettlebell'
  ? {session:'foundry.session.v2', weights:'foundry.weights.v3', weightsLegacy:'foundry.weights.v2', history:'foundry.history.v2'}
  : {session:'kb.session.'+p, weights:'kb.weights.'+p, weightsLegacy:null, history:'kb.history.'+p};
let K = KEYS(PROG.id);

const K_A2HS = 'foundry.a2hs.dismissed', K_CODE = 'foundry.code';
const CODE_CHARS = 'ACDEFGHJKLMNPQRTUVWXY34679';
function makeCode(){
  let s = '';
  const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(9)) : null;
  for(let i=0;i<9;i++) s += CODE_CHARS[(r ? r[i] : Math.floor(Math.random()*256)) % CODE_CHARS.length];
  return s.slice(0,3)+'-'+s.slice(3,6)+'-'+s.slice(6);
}
const cleanCode = v => String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,9);
const fmtCode = v => { const c = cleanCode(v); return c.length===9 ? c.slice(0,3)+'-'+c.slice(3,6)+'-'+c.slice(6) : c; };
function myCode(){
  let c = localStorage.getItem(K_CODE);
  if(!c || cleanCode(c).length !== 9){ c = makeCode(); localStorage.setItem(K_CODE, c); }
  return c;
}
function adoptCode(v){
  const c = cleanCode(v);
  if(c.length !== 9) return false;
  localStorage.setItem(K_CODE, fmtCode(c));
  location.reload();
  return true;
}
const pair = (v, fb) => Array.isArray(v) ? [v[0]||fb, v[1]||v[0]||fb] : (typeof v === 'number' ? [v,v] : [fb,fb]);
function normWeights(raw, list){
  list = list || EX;
  return list.map((e,i)=> pair(raw && raw[i], e.kg));
}
let weights = normWeights(readJSON(K.weights, null) || (K.weightsLegacy ? readJSON(K.weightsLegacy, null) : null));
const saveWeights = () => { writeJSON(K.weights, weights); writeJSON(K.weights+'.at', Date.now()); };
const kgText = i => (EX[i].perSide && weights[i][0] !== weights[i][1]) ? weights[i][0]+'/'+weights[i][1]+' kg' : weights[i][0]+' kg';
function tonnage(logged, w, list){
  list = list || EX; w = w || weights;
  return Math.round(list.reduce((a,e,i)=>{
    const n = logged[i] || 0; if(!n) return a;
    if(!e.perSide) return a + n * pair(w[i], e.kg)[0];
    const p = pair(w[i], e.kg);
    return a + (Math.ceil(n/2)*p[0] + Math.floor(n/2)*p[1]) / 2;
  },0));
}
let history = readJSON(K.history, []);

const state = {
  program: PROG.id,
  view:'overview', ex:0,
  logged: EX.map(()=>0),
  status: EX.map(()=>'pending'),        // pending | done | skipped
  effort: EX.map(()=>null),             // easy | right | hard
  accum:0, runningSince:null,          // wall-clock session stopwatch
  restEndsAt:null, restTotal:0, restNext:'', restKind:'',
  lastPoppedDot:-1, savedAt:0
};

function persist(){
  const live = state.logged.some(n=>n>0) && state.view !== 'finished';
  if(!live){ localStorage.removeItem(K.session); return; }
  writeJSON(K.session, {
    ex:state.ex, logged:state.logged, status:state.status,
    accum:elapsed(), restEndsAt:state.restEndsAt, restTotal:state.restTotal,
    restNext:state.restNext, restKind:state.restKind, savedAt:Date.now()
  });
}
function restoreSession(keys){
  const s = readJSON(keys.session, null);
  if(!s || !s.logged || Date.now() - (s.savedAt||0) > 8*3600*1000) return null;
  return s;
}
function applySaved(s){
  if(!s) return;
  state.ex = s.ex||0;
  state.logged = EX.map((_,i)=> (s.logged && s.logged[i]) || 0);
  state.status = EX.map((_,i)=> (s.status && s.status[i]) || 'pending');
  state.accum = s.accum||0;
  if(s.restEndsAt && s.restEndsAt > Date.now()){
    state.restEndsAt = s.restEndsAt; state.restTotal = s.restTotal;
    state.restNext = s.restNext; state.restKind = s.restKind;
  }
}

function switchProgram(id){
  if(!PROGRAMS[id] || id === state.program) return;
  persist();
  pauseStopwatch(); releaseWakeLock();
  localStorage.setItem(K_PROGRAM, id);
  PROG = PROGRAMS[id]; EX = PROG.ex; K = KEYS(id);
  totalTaps = EX.reduce((a,_,i)=>a+taps(i),0);
  weights = normWeights(readJSON(K.weights, null) || (K.weightsLegacy ? readJSON(K.weightsLegacy, null) : null));
  history = readJSON(K.history, []);
  state.program = id; state.view = 'overview'; state.ex = 0;
  state.logged = EX.map(()=>0); state.status = EX.map(()=>'pending'); state.effort = EX.map(()=>null);
  state.accum = 0; state.runningSince = null; state.restEndsAt = null;
  applySaved(restoreSession(K));
  paintHeader();
  render('fwd');
}
function paintHeader(){
  document.getElementById('progName').textContent = PROG.name;
  document.getElementById('progEyebrow').textContent = PROG.eyebrow;
}

/* ---------- SYNC BRIDGE (Firebase, optional) ---------- */
const sync = { state:'off', at:0, pushFn:null };
const SYNC_TEXT = {
  off:'Local only — this device',
  connecting:'Connecting…',
  ok:'Synced across devices',
  offline:'Offline — will sync when back',
  error:'Sync unavailable — saved locally'
};
function syncLine(){
  const el = document.getElementById('syncLine');
  if(!el) return;
  const cls = sync.state==='ok' ? 'ok' : sync.state==='connecting' ? 'wait' : '';
  const when = (sync.state==='ok' && sync.at) ? ' · '+new Date(sync.at).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}) : '';
  el.className = 'sync-line '+cls;
  el.innerHTML = '<span class="sync-dot"></span><span>'+SYNC_TEXT[sync.state]+when+'</span>';
}
function mergeHistory(a, b){
  const byDate = {};
  (a||[]).concat(b||[]).forEach(h => {
    if(!h || !h.date) return;
    const k = String(h.date);
    if(!byDate[k] || (h.effort && !byDate[k].effort)) byDate[k] = h;
  });
  return Object.keys(byDate).map(k=>byDate[k]).sort((x,y)=> y.date - x.date).slice(0,24);
}
function localSnapshot(){
  const programs = {};
  Object.keys(PROGRAMS).forEach(p => {
    const kk = KEYS(p);
    programs[p] = {
      history: p === state.program ? history : readJSON(kk.history, []),
      weights: p === state.program ? weights : readJSON(kk.weights, null)
    };
  });
  return { programs: programs, history: programs.kettlebell.history, weights: programs.kettlebell.weights, updatedAt: Date.now() };
}
function pushSync(){ if(sync.pushFn){ try{ sync.pushFn(localSnapshot()); }catch(e){} } }
window.KB = {
  code: myCode,
  onPush(fn){ sync.pushFn = fn; },
  status(st){ sync.state = st; if(st==='ok') sync.at = Date.now(); syncLine(); },
  snapshot: localSnapshot,
  applyRemote(remote){
    if(!remote) return;
    const incoming = remote.programs || { kettlebell: { history: remote.history, weights: remote.weights } };
    let changed = false;
    Object.keys(PROGRAMS).forEach(p => {
      const inc = incoming[p]; if(!inc) return;
      const kk = KEYS(p);
      const mine = p === state.program ? history : readJSON(kk.history, []);
      const merged = mergeHistory(mine, inc.history);
      if(JSON.stringify(merged) !== JSON.stringify(mine)){
        writeJSON(kk.history, merged);
        if(p === state.program){ history = merged; changed = true; }
      }
      if(inc.weights && (remote.updatedAt||0) > (readJSON(kk.weights+'.at', 0) || 0)){
        const nw = normWeights(inc.weights, PROGRAMS[p].ex);
        if(JSON.stringify(nw) !== JSON.stringify(readJSON(kk.weights, null))){
          writeJSON(kk.weights, nw);
          if(p === state.program){ weights = nw; changed = true; }
        }
      }
    });
    sync.state = 'ok'; sync.at = Date.now();
    if(changed && (state.view === 'overview' || state.view === 'history')) render();
    else syncLine();
  }
};

/* ---------- CLOCKS ---------- */
const fmt = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.max(0,Math.floor(s%60))).padStart(2,'0');
const elapsed = () => Math.floor(state.accum + (state.runningSince ? (Date.now()-state.runningSince)/1000 : 0));
const restLeft = () => state.restEndsAt ? Math.max(0, Math.ceil((state.restEndsAt - Date.now())/1000)) : 0;
const isResting = () => state.restEndsAt !== null && restLeft() > 0;

function startStopwatch(){ if(!state.runningSince) state.runningSince = Date.now(); }
function pauseStopwatch(){ if(state.runningSince){ state.accum = elapsed(); state.runningSince = null; } }

let restDone = false;
function tick(){
  if(state.view !== 'session') return;
  const topClock = document.getElementById('sessClockVal');
  if(topClock) topClock.textContent = fmt(elapsed());
  if(state.restEndsAt !== null){
    const left = restLeft();
    const c = document.getElementById('restClockVal');
    if(c) c.textContent = fmt(left);
    const f = document.getElementById('restFillVal');
    if(f) f.style.width = (state.restTotal ? (1 - left/state.restTotal)*100 : 0).toFixed(1)+'%';
    const b = document.getElementById('restBannerEl');
    if(b) b.classList.toggle('urgent', left <= 10 && left > 0);
    if(left <= 0 && !restDone){ restDone = true; endRest(true); }
  }
}
setInterval(tick, 500);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ tick(); requestWakeLock(); } });

/* ---------- ALERTS (Safari-friendly) ---------- */
let audioCtx = null;
function primeAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  primeAudio();
  if(!audioCtx) return;
  [0, 0.22].forEach(off => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + off;
    o.type = 'square'; o.frequency.value = off ? 1046 : 784;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.18);
  });
  if(navigator.vibrate) navigator.vibrate([120, 60, 120]);
}
let wakeLock = null;
async function requestWakeLock(){
  if(state.view !== 'session' || !('wakeLock' in navigator)) return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock = null; }); }catch(e){}
}
function releaseWakeLock(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; } }

/* ---------- SESSION LOGIC ---------- */
const openLift = i => state.status[i] === 'pending' && state.logged[i] < taps(i);
function nextPending(from){
  for(let i=from;i<EX.length;i++) if(state.status[i]==='pending' && state.logged[i]<taps(i)) return i;
  for(let i=0;i<from;i++) if(state.status[i]==='pending' && state.logged[i]<taps(i)) return i;
  return -1;
}
const sideLabel = (i, n) => EX[i].perSide ? (n % 2 === 0 ? 'Left' : 'Right') : null;

function beginRest(sec, label, kind){
  if(!sec){ state.restEndsAt = null; render(); persist(); return; }
  state.restEndsAt = Date.now() + sec*1000; state.restTotal = sec; state.restNext = label; state.restKind = kind || '';
  restDone = false; render();
}
function endRest(auto){
  state.restEndsAt = null; state.restTotal = 0; restDone = false;
  if(auto) beep();
  render(); persist();
}
const setNo = i => Math.floor(state.logged[i]/(EX[i].perSide?2:1)) + 1;

function logSet(){
  primeAudio();
  const i = state.ex, ex = EX[i], n = state.logged[i] + 1;
  state.logged[i] = n; state.lastPoppedDot = n - 1;

  if(PROG.pairs){
    // Unilateral: switch sides with no rest, stay on the same lift.
    if(ex.perSide && n % 2 === 1){ render(); persist(); return; }
    if(n >= taps(i)) state.status[i] = 'done';
    const pr = PROG.pairs[pairIndex(i)];
    const partner = pr[0] === i ? pr[1] : pr[0];
    if(pr[0] === i && openLift(partner)){
      state.ex = partner;
      beginRest(PROG.rests.within, EX[partner].name + ' — set ' + setNo(partner), 'within');
      persist(); return;
    }
    const back = pr.filter(openLift)[0];
    if(back !== undefined){
      state.ex = back;
      beginRest(PROG.rests.between, EX[back].name + ' — set ' + setNo(back), 'round');
      persist(); return;
    }
    const nx = nextPending(0);
    if(nx === -1){ finish(); return; }
    state.ex = nx;
    beginRest(PROG.rests.between, EX[nx].name, 'pair');
    persist(); return;
  }

  if(n >= taps(i)){
    state.status[i] = 'done';
    const nx = nextPending(i+1);
    if(nx === -1){ finish(); return; }
    state.ex = nx;
    beginRest(PROG.rests.lift, EX[nx].name, 'lift');
    return;
  }
  if(ex.perSide && n % 2 === 1) beginRest(PROG.rests.side, ex.name + ' — right side', 'side');
  else beginRest(PROG.rests.set, ex.name + ' — set ' + setNo(i), 'set');
  persist();
}
function setLogged(i, n){
  state.logged[i] = n;
  state.status[i] = n >= taps(i) ? 'done' : (state.status[i]==='skipped' ? 'skipped' : 'pending');
  state.lastPoppedDot = n - 1;
  render(); persist();
}
function undo(){
  if(state.logged[state.ex] > 0) setLogged(state.ex, state.logged[state.ex]-1);
}
function skipLift(){
  state.status[state.ex] = 'skipped';
  const nx = nextPending(state.ex+1);
  state.restEndsAt = null;
  if(nx === -1){ finish(); return; }
  state.ex = nx; render('fwd'); persist();
}
function goLift(i, dir){
  state.ex = i; state.restEndsAt = null; state.view = 'session';
  startStopwatch(); requestWakeLock(); render(dir || 'fwd'); persist();
}
function finish(force){
  const pend = nextPending(0);
  if(pend !== -1 && !force){
    state.ex = pend;
    beginRest(PROG.pairs ? PROG.rests.between : PROG.rests.lift, EX[pend].name, 'pair');
    persist(); return;
  }
  pauseStopwatch(); releaseWakeLock();
  state.restEndsAt = null; state.view = 'finished';
  const entry = {
    date: Date.now(), secs: elapsed(), program: PROG.id,
    sets: state.logged.reduce((a,n,i)=> a + Math.floor(n/(EX[i].perSide?2:1)), 0),
    lifts: state.status.filter(s=>s==='done').length,
    tonnage: tonnage(state.logged),
    weights: weights.map(w=>w.slice()),
    effort: state.effort.slice()
  };
  history = [entry].concat(history).slice(0,24);
  writeJSON(K.history, history);
  pushSync();
  localStorage.removeItem(K.session);
  render();
}
function resetAll(){
  state.ex = 0; state.logged = EX.map(()=>0); state.status = EX.map(()=>'pending'); state.effort = EX.map(()=>null);
  state.accum = 0; state.runningSince = null; state.restEndsAt = null; state.view = 'overview';
  localStorage.removeItem(K.session); render('back');
}
function exitToOverview(){ pauseStopwatch(); releaseWakeLock(); state.view = 'overview'; render('back'); persist(); }
function startSession(){
  primeAudio();
  const i = nextPending(0);
  goLift(i === -1 ? 0 : i, 'fwd');
}
function loadStep(i){
  const base = PROG.step || 2;
  if(PROG.stepFrom && weights[i][0] < PROG.stepFrom) return base / 2;
  return base;
}
function bumpWeight(i, side, d){
  const step = loadStep(i);
  const v = Math.max(step, Math.round((weights[i][side] + (d > 0 ? step : -step)) * 2) / 2);
  if(EX[i].perSide) weights[i][side] = v; else weights[i] = [v,v];
  saveWeights(); pushSync(); render();
}
function rate(i, val){
  state.effort[i] = state.effort[i] === val ? null : val;
  if(history[0]){ history[0].effort = state.effort.slice(); writeJSON(K.history, history); pushSync(); }
  render();
}

/* ---------- CTA BAR ---------- */
function setCta(html, handlers){
  const bar = document.getElementById('stickyCta'), inner = document.getElementById('ctaInner');
  if(!html){ bar.classList.add('hidden'); inner.innerHTML = ''; return; }
  inner.innerHTML = html; bar.classList.remove('hidden');
  Object.keys(handlers||{}).forEach(id => {
    const el = document.getElementById(id); if(el) el.addEventListener('click', handlers[id]);
  });
}

/* ---------- VIEWS ---------- */
function programPicker(){
  return '<div class="prog-pick">' + Object.keys(PROGRAMS).map(id => {
    const p = PROGRAMS[id];
    return '<button class="prog-opt'+(id===state.program?' on':'')+'" data-prog="'+id+'">'
      + '<p class="prog-opt-name">'+p.short+'</p><p class="prog-opt-sub">'+p.sub+'</p></button>';
  }).join('') + '</div>';
}

function exRow(e, i, opts){
  const st = state.status[i];
  const setsDone = Math.floor(state.logged[i]/(e.perSide?2:1));
  const color = st==='done' ? 'var(--accent)' : st==='skipped' ? 'var(--n500)' : 'var(--n600)';
  const label = st==='done' ? 'Done' : st==='skipped' ? 'Skipped' : (state.logged[i]>0 ? setsDone+'/'+e.sets : '');
  return '<button class="row" style="animation-delay:'+(i*55)+'ms" data-jump="'+i+'">'
    + '<p class="row-num" style="color:'+(st==='done'?'var(--accent)':'var(--n500)')+'">'+(opts&&opts.tag ? opts.tag : String(i+1).padStart(2,'0'))+'</p>'
    + '<div class="row-art">'+svgWrap(art(e.pose,true))+'</div>'
    + '<div><p class="row-name">'+e.name+'</p><p class="row-scheme">'+e.sets+' × '+e.reps+'</p>'
    + '<span class="row-tags"><span class="tag-outline">'+e.muscle+'</span><span class="tag-outline tag-load">'+kgText(i)+'</span></span></div>'
    + '<p class="row-state" style="color:'+color+'">'+label+'</p></button>';
}

function renderOverview(){
  const done = state.status.filter(s=>s==='done').length;
  const loggedSets = state.logged.reduce((a,n,i)=> a + Math.floor(n/(EX[i].perSide?2:1)), 0);
  const inProgress = state.logged.some(n=>n>0);

  let rows = '';
  if(PROG.pairs){
    rows = PROG.pairs.map((pr, pi) =>
      '<p class="pair-label"><span>Superset '+(pi+1)+'</span><span>'
      + (pi < PROG.pairs.length-1 ? PROG.rests.within+'s between · '+PROG.rests.between+'s after' : PROG.rests.within+'s between')
      + '</span></p>'
      + pr.map((i,k)=> exRow(EX[i], i, {tag:(pi+1)+String.fromCharCode(65+k)})).join('')
    ).join('');
  } else {
    rows = '<p class="section-label">The order</p>' + EX.map((e,i)=>exRow(e,i)).join('');
  }

  const last = history[0];
  const lastLine = last
    ? '<div class="hist-row"><span>Last session · '+new Date(last.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span><span>'+fmt(last.secs)+' · '+last.sets+' sets</span></div>'
    : '';
  const resume = inProgress
    ? '<div class="resume-note"><p><strong>Session in progress.</strong> '+loggedSets+' set'+(loggedSets===1?'':'s')+' logged, '+fmt(elapsed())+' on the clock.</p><button class="text-btn" id="discardBtn">Discard</button></div>'
    : '';

  const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const a2hs = (!standalone && !localStorage.getItem(K_A2HS))
    ? '<div class="a2hs"><p><strong>Add it to your home screen.</strong> Share → Add to Home Screen — it launches full screen and keeps working with no signal.</p><button class="text-btn" id="a2hsBtn">Got it</button></div>'
    : '';

  const wu = PROG.warmup;
  const wuOpen = localStorage.getItem('kb.warm.'+PROG.id+'.open') === '1';
  const warmup = wu ? '<div class="warm">'
    + '<button class="warm-head" id="warmToggle"><div>'
    + '<p class="warm-title">Warm-up · '+wu.mins+' min</p>'
    + '<p class="warm-sub">'+wu.items.length+' movements before the first lift</p></div>'
    + '<span class="warm-chev">'+(wuOpen?'−':'+')+'</span></button>'
    + '<div class="warm-body" id="warmBody"'+(wuOpen?'':' hidden')+'>'
    + wu.items.map((w,k)=>'<div class="warm-item"><p class="warm-n">'+(k+1)+'</p>'
      + '<div><p class="warm-name">'+w.name+'</p><p class="warm-note">'+w.note+'</p></div>'
      + '<p class="warm-dose">'+w.dose+'</p></div>').join('')
    + '<p class="warm-foot">Once a week means you arrive cold. '+wu.mins+' minutes here is the cheapest injury insurance in the session.</p>'
    + '</div></div>' : '';

  document.getElementById('main').innerHTML = programPicker()
    + '<div class="stat-row">'
    + '<div class="stat"><p class="stat-label">Lifts done</p><p class="stat-val">'+done+'<small>/'+EX.length+'</small></p></div>'
    + '<div class="stat"><p class="stat-label">Sessions</p><p class="stat-val">'+history.length+'<small> logged</small></p></div>'
    + '<div class="stat"><p class="stat-label">Volume</p><p class="stat-val">'+EX.reduce((a,e)=>a+e.sets,0)+'<small> sets</small></p></div>'
    + '</div>' + a2hs + resume + warmup + rows
    + '<hr class="hr">' + lastLine
    + (history.length ? '<button class="howto-link" id="histLink" style="margin-top:16px"><span>▤</span><span>Session history — '+history.length+' logged</span></button>' : '')
    + '<p class="footnote">'+PROG.restNote+'</p>'
    + '<button class="howto-link" id="howtoLink"><span>▶</span><span>How to do these — video guide</span></button>'
    + '<p class="sync-line" id="syncLine"></p>';

  const wt = document.getElementById('warmToggle');
  if(wt) wt.addEventListener('click', ()=>{
    const b = document.getElementById('warmBody');
    b.hidden = !b.hidden;
    wt.querySelector('.warm-chev').textContent = b.hidden ? '+' : '−';
    localStorage.setItem('kb.warm.'+PROG.id+'.open', b.hidden ? '0' : '1');
  });
  document.querySelectorAll('[data-prog]').forEach(el => el.addEventListener('click', ()=> switchProgram(el.dataset.prog)));
  document.querySelectorAll('[data-jump]').forEach(el => el.addEventListener('click', ()=> goLift(+el.dataset.jump, 'fwd')));
  document.getElementById('howtoLink').addEventListener('click', ()=>{ state.view='howto'; render('fwd'); });
  const d = document.getElementById('discardBtn'); if(d) d.addEventListener('click', resetAll);
  const h = document.getElementById('histLink'); if(h) h.addEventListener('click', ()=>{ state.view='history'; render('fwd'); });
  const ab = document.getElementById('a2hsBtn');
  if(ab) ab.addEventListener('click', ()=>{ localStorage.setItem(K_A2HS,'1'); render(); });

  syncLine();
  setCta('<button class="btn btn-primary" id="startBtn"><span>'+(inProgress?'Resume session':'Start session')+'</span><span>→</span></button>', {startBtn:startSession});
}

function sessionTop(){
  const loggedTaps = state.logged.reduce((a,b)=>a+b,0);
  return '<div class="sess-top">'
    + '<button class="exit-link" id="exitBtn">← Overview</button>'
    + '<div class="sess-meta"><p class="sess-label">'+loggedTaps+'/'+totalTaps+' logged</p>'
    + '<p class="sess-clock" id="sessClockVal">'+fmt(elapsed())+'</p></div></div>'
    + '<div class="progress-track"><div class="progress-fill" style="width:'+(loggedTaps/totalTaps*100).toFixed(1)+'%"></div></div>';
}

function partnerBlock(i){
  const pi = pairIndex(i);
  if(pi < 0) return '';
  const pr = PROG.pairs[pi];
  const other = pr[0] === i ? pr[1] : pr[0];
  const e = EX[other], per = e.perSide ? 2 : 1;
  const setsDone = Math.floor(state.logged[other]/per);
  let dots = '';
  for(let s=0;s<e.sets;s++) dots += '<span class="partner-dot'+(s<setsDone?' filled':'')+'"></span>';
  return '<button class="partner" data-jump="'+other+'">'
    + '<div class="partner-art">'+svgWrap(art(e.pose,true))+'</div>'
    + '<div><p class="partner-label">'+(pr[0]===other?'Paired with — first':'Paired with — second')+'</p>'
    + '<p class="partner-name">'+e.name+'</p></div>'
    + '<span class="partner-dots">'+dots+'</span></button>';
}

function renderLifting(trans){
  const i = state.ex, ex = EX[i], per = ex.perSide ? 2 : 1, n = state.logged[i];
  const cues = ex.cues.map((c,k)=>'<div class="cue"><p class="cue-n">'+(k+1)+'</p><p class="cue-text">'+c+'</p></div>').join('');
  let dots = '';
  for(let s=0; s<ex.sets; s++){
    let grp = '';
    for(let k=0; k<per; k++){
      const idx = s*per + k;
      const cls = 'set-dot' + (idx<n?' filled':'') + (idx===n?' current':'') + (idx===state.lastPoppedDot?' pop':'');
      grp += '<button class="'+cls+'" data-dot="'+idx+'">'+(idx<n ? '✓' : (ex.perSide ? (k?'R':'L') : (s+1)))+'</button>';
    }
    dots += '<div class="set-pair">'+grp+'</div>';
  }
  const nextSide = sideLabel(i, n);
  const setsDone = Math.floor(n/per);
  const prev = history.find(h => h.weights && h.weights[i]);
  const prevW = prev ? pair(prev.weights[i], ex.kg) : null;
  const prevEffort = prev && prev.effort ? prev.effort[i] : null;
  const prevTxt = prevW ? (prevW[0] === prevW[1] ? prevW[0]+' kg' : prevW[0]+'/'+prevW[1]+' kg') : null;
  const bump = loadStep(i) + ' kg';
  const suggest = !prevTxt ? null
    : prevEffort === 'easy'  ? 'Last session '+prevTxt+' · felt easy — go up '+bump
    : prevEffort === 'hard'  ? 'Last session '+prevTxt+' · felt hard — hold or drop '+bump
    : prevEffort === 'right' ? 'Last session '+prevTxt+' · felt right'
    : 'Last session '+prevTxt;
  const stepTxt = loadStep(i) + ' kg steps';
  const loadCtl = k => '<div class="load-ctl">'
    + '<span class="load-side">'+(ex.perSide ? (k?'R':'L') : '')+'</span>'
    + '<button class="step-btn" data-kg="'+k+'|-1" aria-label="Decrease load">−</button>'
    + '<p class="load-val">'+weights[i][k]+'<span> kg</span></p>'
    + '<button class="step-btn" data-kg="'+k+'|1" aria-label="Increase load">+</button></div>';

  const pi = pairIndex(i);
  const eyebrowText = pi >= 0
    ? 'Superset '+(pi+1)+' of '+PROG.pairs.length+' · '+(PROG.pairs[pi][0]===i ? 'first lift' : 'second lift')
    : 'Lift '+(i+1)+' of '+EX.length;

  document.getElementById('main').innerHTML = sessionTop()
    + '<div class="stage '+(trans==='fwd'?'slide-fwd':trans==='back'?'slide-back':'')+'">'
    + '<div class="stage-head"><div><p class="stage-eyebrow">'
    + '<button class="step-btn" id="prevLift" '+(i===0?'disabled':'')+' aria-label="Previous lift">‹</button>'
    + '<span>'+eyebrowText+'</span>'
    + '<button class="step-btn" id="nextLift" '+(i===EX.length-1?'disabled':'')+' aria-label="Next lift">›</button>'
    + '</p><h2 class="stage-name">'+ex.name+'</h2></div>'
    + '<p class="stage-scheme">'+ex.sets+' × '+ex.reps+'</p></div>'
    + '<div class="stage-visual"><div class="stage-art">'+svgWrap(art(ex.pose,false))+'</div>'
    + '<div class="stage-side"><div><p class="mlabel">Primary</p><p class="mname">'+ex.muscle+'</p></div>'
    + (nextSide ? '<div><p class="mlabel">Next</p><p class="mname">'+nextSide+' side</p></div>' : '')
    + '<a class="text-btn" href="'+ex.video+'" target="_blank" rel="noopener noreferrer">▶ Watch form ↗</a></div></div>'
    + '<div class="load-row"><div><p class="mlabel">Load</p>'
    + (suggest ? '<p class="load-last">'+suggest+'</p>' : '<p class="load-last">Set the weight you\'re using</p>')
    + '<p class="load-last" style="color:var(--n500)">'+stepTxt+'</p>'
    + '</div><div class="load-steppers">'+(ex.perSide ? loadCtl(0)+loadCtl(1) : loadCtl(0))+'</div></div>'
    + partnerBlock(i)
    + cues
    + '<div class="set-row"><div class="set-dots">'+dots+'</div>'
    + '<p class="sets-line">'+setsDone+' of '+ex.sets+' sets'+(nextSide?' · '+nextSide+' next':'')+'</p></div>'
    + '<p class="dots-hint">Tap any box to correct the count.</p>'
    + '<div class="stage-foot"><button class="text-btn" id="undoBtn" '+(n===0?'style="opacity:.35"':'')+'>↺ Undo last</button>'
    + '<span style="display:flex;gap:18px"><button class="text-btn" id="skipBtn">Skip this lift →</button>'
    + '<button class="text-btn" id="endBtn" style="color:var(--accent-700)">End session</button></span></div>'
    + '</div>';

  document.getElementById('exitBtn').addEventListener('click', exitToOverview);
  document.getElementById('skipBtn').addEventListener('click', skipLift);
  document.getElementById('endBtn').addEventListener('click', ()=>{
    const pend = state.status.filter((s,k)=> s==='pending' && state.logged[k]<taps(k)).length;
    if(!pend || confirm(pend+' lift'+(pend>1?'s':'')+' still unfinished. End the session anyway?')) finish(true);
  });
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.querySelectorAll('[data-kg]').forEach(el => el.addEventListener('click', ()=>{
    const p = el.dataset.kg.split('|'); bumpWeight(i, +p[0], +p[1]);
  }));
  const p = document.getElementById('prevLift'), nx = document.getElementById('nextLift');
  if(!p.disabled) p.addEventListener('click', ()=>goLift(i-1,'back'));
  if(!nx.disabled) nx.addEventListener('click', ()=>goLift(i+1,'fwd'));
  document.querySelectorAll('[data-jump]').forEach(el => el.addEventListener('click', ()=> goLift(+el.dataset.jump,'fwd')));
  document.querySelectorAll('[data-dot]').forEach(el => el.addEventListener('click', ()=>{
    const idx = +el.dataset.dot;
    setLogged(i, idx + 1 === state.logged[i] ? idx : idx + 1);
  }));
  state.lastPoppedDot = -1;

  const label = ex.perSide ? 'Log '+(nextSide||'Left').toLowerCase()+' side' : 'Log set '+(setsDone+1);
  setCta('<button class="btn btn-primary" id="logSetBtn"><span>'+label+'</span><span>✓</span></button>', {logSetBtn:logSet});
}

function renderResting(){
  const left = restLeft(), ex = EX[state.ex];
  const kindText = {
    side:'Switch sides', lift:'Next lift', set:'Between sets',
    within:'Switch stations', round:'Next round', pair:'Next superset'
  }[state.restKind] || 'Rest';
  document.getElementById('main').innerHTML = sessionTop()
    + '<div class="rest"><div class="rest-banner'+(left<=10?' urgent':'')+'" id="restBannerEl">'
    + '<p class="rest-eyebrow"><span>Rest</span><span>'+kindText+'</span></p>'
    + '<p class="rest-clock" id="restClockVal">'+fmt(left)+'</p>'
    + '<div class="rest-track"><div class="rest-fill" id="restFillVal" style="width:'+(state.restTotal?(1-left/state.restTotal)*100:0).toFixed(1)+'%"></div></div></div>'
    + '<div class="rest-next"><div><p class="mlabel">Up next</p><p class="rest-next-name">'+state.restNext+'</p></div>'
    + '<p class="sess-clock">'+kgText(state.ex)+'</p></div>'
    + '<div class="rest-preview"><div class="rest-preview-art">'+svgWrap(art(ex.pose,true))+'</div>'
    + '<p class="rest-cue">'+ex.cues[0]+'</p></div>'
    + '<p class="footnote">'+PROG.restCue+'</p></div>';
  document.getElementById('exitBtn').addEventListener('click', exitToOverview);
  setCta('<p class="cta-hint">Resting — '+fmt(left)+' left</p>'
    + '<div style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px">'
    + '<button class="btn btn-outline btn-sm" id="addRestBtn">+15s</button>'
    + '<button class="btn btn-dark" id="skipRestBtn"><span>Skip rest</span><span>→</span></button></div>',
    {addRestBtn: ()=>{ state.restEndsAt += 15000; state.restTotal += 15; tick(); persist(); },
     skipRestBtn: ()=> endRest(false)});
}

function renderFinished(){
  const done = state.status.filter(s=>s==='done').length;
  const skipped = state.status.filter(s=>s==='skipped').length;
  const sets = state.logged.reduce((a,n,i)=> a + Math.floor(n/(EX[i].perSide?2:1)), 0);
  const volume = tonnage(state.logged);
  const prevSession = history[1] || null;
  const delta = prevSession ? sets - prevSession.sets : null;
  const rated = EX.map((e,i)=>{
    if(!state.logged[i]) return '';
    const opts = ['easy','right','hard'].map(v =>
      '<button class="rate-opt'+(state.effort[i]===v?' on':'')+'" data-rate="'+i+'|'+v+'">'+v+'</button>').join('');
    return '<div class="rate-row"><p class="rate-name">'+e.name+'</p><span class="rate-opts">'+opts+'</span></div>';
  }).join('');
  const log = EX.map((e,i)=>{
    const s = Math.floor(state.logged[i]/(e.perSide?2:1));
    const st = state.status[i]==='skipped' ? 'Skipped' : (s===0 ? 'Not done' : s+'/'+e.sets+' sets · '+kgText(i));
    return '<tr><td>'+e.name+'</td><td>'+st+'</td></tr>';
  }).join('');

  document.getElementById('main').innerHTML =
    '<div class="finished"><div class="fin-banner"><p class="fin-eyebrow">'+PROG.name+' · session '+history.length+' complete</p>'
    + '<h2 class="fin-title">Week<br>logged.</h2>'
    + '<p class="fin-sub">'+(delta===null ? 'First one on the board.' : delta > 0 ? '+'+delta+' sets on last time.' : delta === 0 ? 'Matched last time, set for set.' : Math.abs(delta)+' sets down on last time — still logged.')+'</p></div>'
    + '<div class="fin-stats">'
    + '<div class="fin-stat"><p class="fin-stat-label">Total time</p><p class="fin-stat-val">'+fmt(elapsed())+'</p></div>'
    + '<div class="fin-stat"><p class="fin-stat-label">Lifts</p><p class="fin-stat-val">'+done+'<small>'+(skipped?' · '+skipped+' skipped':'')+'</small></p></div>'
    + '<div class="fin-stat"><p class="fin-stat-label">Tonnage</p><p class="fin-stat-val">'+volume+'<small> kg·set</small></p></div>'
    + '</div><p class="section-label">The log</p><table class="fin-log">'+log+'</table>'
    + (rated.length ? '<p class="section-label">How did it feel?</p>' + rated : '')
    + '<p class="fin-copy">Next one in seven days — same order. Whatever you marked <em>easy</em> comes back with a "go up" note.</p>'
    + '<button class="btn btn-outline" id="restartBtn" style="border-color:var(--text)"><span>Back to overview</span><span>→</span></button></div>';
  document.getElementById('restartBtn').addEventListener('click', resetAll);
  document.querySelectorAll('[data-rate]').forEach(el => el.addEventListener('click', ()=>{
    const p = el.dataset.rate.split('|'); rate(+p[0], p[1]);
  }));
  setCta(null);
}

function renderHistory(){
  const series = history.slice(0,10).reverse();
  const max = Math.max.apply(null, series.map(h=>h.tonnage||0).concat([1]));
  const bars = series.map(h=>'<div class="spark-col"><div class="spark-bar'+(h.tonnage?'':' dim')+'" style="height:'+Math.max(4,((h.tonnage||0)/max)*100)+'%"></div></div>').join('');
  const rows = history.map(h=>{
    const t = h.tonnage ? h.tonnage+' kg·set' : '—';
    return '<div class="hist-row"><span>'+new Date(h.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})
      +'</span><span>'+fmt(h.secs)+' · '+h.sets+' sets · '+t+'</span></div>';
  }).join('');
  const best = history.reduce((a,h)=> Math.max(a, h.tonnage||0), 0);
  document.getElementById('main').innerHTML =
    '<div class="sess-top"><button class="exit-link" id="histBackBtn">← Overview</button>'
    + '<p class="sess-label">'+PROG.name+'</p></div>'
    + '<div class="stat-row" style="border-top:none">'
    + '<div class="stat"><p class="stat-label">Sessions</p><p class="stat-val">'+history.length+'</p></div>'
    + '<div class="stat"><p class="stat-label">Best tonnage</p><p class="stat-val">'+best+'<small> kg·set</small></p></div>'
    + '<div class="stat"><p class="stat-label">Last</p><p class="stat-val">'+(history[0]?fmt(history[0].secs):'—')+'</p></div>'
    + '</div>'
    + '<p class="section-label">Tonnage, last '+series.length+' sessions</p>'
    + '<div class="spark">'+bars+'</div>'
    + '<p class="section-label">The record</p>' + rows
    + '<p class="footnote">Each program keeps its own record. Tonnage counts every logged set at the weight you used — the honest measure of whether the week actually got heavier.</p>'
    + '<div class="code-box"><p class="mlabel">Your log code</p>'
    + '<p class="code-val" id="codeVal">'+myCode()+'</p>'
    + '<p class="code-copy">Both programs are backed up under this code. Write it down — enter it on another device, or after clearing Safari, to get this history back.</p>'
    + '<div class="code-actions"><button class="text-btn" id="codeCopyBtn">Copy code</button>'
    + '<button class="text-btn" id="codeUseBtn">Use another code</button></div>'
    + '<div class="code-form" id="codeForm" hidden>'
    + '<input class="code-input" id="codeInput" placeholder="ABC-DEF-GHJ" autocapitalize="characters" autocomplete="off" spellcheck="false">'
    + '<button class="btn btn-outline btn-sm" id="codeGoBtn">Load</button></div></div>'
    + '<p class="sync-line" id="syncLine"></p>';
  document.getElementById('histBackBtn').addEventListener('click', ()=>{ state.view='overview'; render('back'); });
  document.getElementById('codeCopyBtn').addEventListener('click', e => {
    const t = e.currentTarget;
    const done = () => { t.textContent = 'Copied ✓'; setTimeout(()=>{ t.textContent = 'Copy code'; }, 1600); };
    if(navigator.clipboard) navigator.clipboard.writeText(myCode()).then(done).catch(()=>{});
    else done();
  });
  document.getElementById('codeUseBtn').addEventListener('click', ()=>{
    const box = document.getElementById('codeForm');
    box.hidden = !box.hidden;
    if(!box.hidden) document.getElementById('codeInput').focus();
  });
  const goCode = ()=>{
    const v = document.getElementById('codeInput').value;
    if(cleanCode(v).length !== 9){ document.getElementById('codeInput').style.borderColor = 'var(--accent)'; return; }
    if(confirm('Load the log for '+fmtCode(v)+'? This device will switch to that history.')) adoptCode(v);
  };
  document.getElementById('codeGoBtn').addEventListener('click', goCode);
  document.getElementById('codeInput').addEventListener('keydown', e => { if(e.key === 'Enter') goCode(); });
  syncLine();
  setCta(null);
}

function renderHowTo(){
  const rows = EX.map((e,i)=>
    '<a class="video-row" href="'+e.video+'" target="_blank" rel="noopener noreferrer" style="animation-delay:'+(i*55)+'ms">'
    + '<p class="row-num">'+String(i+1).padStart(2,'0')+'</p>'
    + '<div class="video-row-art">'+svgWrap(art(e.pose,true))+'</div>'
    + '<div><p class="video-row-name">'+e.name+'</p><p class="video-row-sub">Tutorial on YouTube ↗</p></div>'
    + '<div class="video-row-play">▶</div></a>').join('');
  document.getElementById('main').innerHTML =
    '<div class="sess-top"><button class="exit-link" id="howtoBackBtn">← Overview</button>'
    + '<p class="sess-label">'+PROG.name+'</p></div>'
    + '<p class="section-label" style="margin-top:20px">Video guide</p>' + rows + '<hr class="hr">'
    + '<p class="footnote">One tutorial per movement — links open on YouTube. Form matters more than load on all six.</p>';
  document.getElementById('howtoBackBtn').addEventListener('click', ()=>{ state.view='overview'; render('back'); });
  setCta(null);
}

function render(trans){
  if(state.view === 'overview') renderOverview();
  else if(state.view === 'howto') renderHowTo();
  else if(state.view === 'history') renderHistory();
  else if(state.view === 'finished') renderFinished();
  else if(isResting()) renderResting();
  else { if(state.restEndsAt !== null) state.restEndsAt = null; renderLifting(trans); }
  window.scrollTo(0,0);
}

/* ---------- BOOT ---------- */
document.getElementById('dateStamp').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
paintHeader();
applySaved(restoreSession(K));
render();
window.addEventListener('pagehide', persist);
window.addEventListener('beforeunload', persist);
document.addEventListener('pointerdown', primeAudio, {once:true});

/* ---------- UPDATE PROMPT ---------- */
function showUpdateToast(worker){
  if(document.getElementById('updateToast')) return;
  const el = document.createElement('div');
  el.className = 'update-toast'; el.id = 'updateToast';
  el.innerHTML = '<div class="update-toast-inner">'
    + '<p>A new version of Kettlebell is ready.</p>'
    + '<button class="later" id="updateLater">Later</button>'
    + '<button class="go" id="updateNow">Reload</button></div>';
  document.body.appendChild(el);
  document.getElementById('updateLater').addEventListener('click', ()=> el.remove());
  document.getElementById('updateNow').addEventListener('click', ()=>{
    persist();
    if(worker) worker.postMessage({type:'SKIP_WAITING'});
    setTimeout(()=> location.reload(), 250);
  });
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg => {
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateToast(reg.waiting);
      reg.addEventListener('updatefound', ()=>{
        const w = reg.installing;
        if(!w) return;
        w.addEventListener('statechange', ()=>{
          if(w.state === 'installed' && navigator.serviceWorker.controller) showUpdateToast(w);
        });
      });
      // Safari never fires updatefound on its own for a backgrounded app — poke it on return.
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch(()=>{});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(reloaded) return; reloaded = true; location.reload();
    });
  });
}
