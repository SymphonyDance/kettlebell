<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foundry">
<title>The Foundry — Kettlebell Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --text:#201e1d;
  --accent:#ec3013; --accent-600:#dd2b0f; --accent-700:#ae1800;
  --divider: rgba(32,30,29,0.4);
  --n100:#f8f4f4; --n200:#eae7e7; --n300:#d7d3d3; --n400:#bab6b6;
  --n500:#9b9797; --n600:#7d7979; --n700:#605d5d; --n800:#444141; --n900:#2d2b2b;
  --font: "Archivo", system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 24px 140px;overflow-x:hidden;}
.hr{border:none;border-top:2px solid var(--divider);margin:0;}

/* HEADER */
header{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:26px 0 12px; border-bottom:2px solid var(--divider);
}
.eyebrow{ margin:0 0 6px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent-700); font-weight:600;}
h1{ margin:0; font-family:var(--font); font-size:34px; line-height:1; letter-spacing:-.01em; text-transform:uppercase; font-weight:800;}
.datestamp{ margin:0; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--n600); font-weight:600;}

/* STAT ROW */
.stat-row{ display:grid; grid-template-columns:repeat(3,1fr); border-bottom:2px solid var(--divider);}
.stat{ padding:20px 0; }
.stat + .stat{ padding-left:20px; border-left:2px solid var(--divider);}
.stat-label{ margin:0 0 4px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.stat-val{ margin:0; font-family:var(--font); font-size:28px; font-weight:800; line-height:1;}
.stat-val small{ font-size:16px; font-weight:600; color:var(--n500);}

.section-label{ margin:26px 0 0; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}

.howto-link{
  display:inline-flex; align-items:center; gap:6px; margin-top:14px;
  border:none; background:none; padding:0; cursor:pointer;
  font-family:var(--font); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent-700); font-weight:700;
}
.howto-link:hover{ color:var(--accent); }

.video-row{
  display:grid; grid-template-columns:34px 76px minmax(0,1fr) auto;
  align-items:center; gap:16px; padding:18px 0; border-top:2px solid var(--divider);
  text-decoration:none; color:inherit;
  opacity:0; animation: rowIn .38s cubic-bezier(.2,.8,.2,1) both;
}
.video-row-art{ height:74px; display:flex; align-items:center; justify-content:center; background:var(--n100);}
.video-row-name{ margin:0 0 3px; font-family:var(--font); font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:-.005em; line-height:1.1;}
.video-row-sub{ margin:0; font-size:13px; color:var(--n600);}
.video-row-play{
  width:40px; height:40px; flex:none; border-radius:50%; background:var(--accent);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px;
}

/* OVERVIEW LIST ROW */
.row{
  display:grid; grid-template-columns:34px 76px minmax(0,1fr) auto;
  align-items:center; gap:16px; padding:18px 0; border-top:2px solid var(--divider);
  opacity:0; animation: rowIn .38s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rowIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
.row-num{ margin:0; font-family:var(--font); font-size:15px; font-weight:800; }
.row-art{ height:74px; display:flex; align-items:center; justify-content:center; background:var(--n100);}
.row-name{ margin:0 0 3px; font-family:var(--font); font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:-.005em; line-height:1.1;}
.row-scheme{ margin:0 0 7px; font-size:13px; color:var(--n600);}
.tag-outline{
  display:inline-block; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  padding:3px 7px; border:1.5px solid var(--n400); color:var(--n700); font-weight:600;
}
.row-state{ margin:0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; white-space:nowrap;}

.footnote{ margin:24px 0 0; font-size:12px; line-height:1.6; color:var(--n600); max-width:46ch;}

/* STICKY CTA */
.sticky-cta{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding:16px 24px calc(16px + env(safe-area-inset-bottom));
  background:var(--bg); border-top:2px solid var(--divider);
  transition: transform .25s ease, opacity .25s ease;
}
.sticky-cta.hidden{ transform:translateY(120%); opacity:0; pointer-events:none;}
.sticky-cta-inner{ max-width:760px; margin:0 auto; }
.btn{
  display:flex; align-items:center; justify-content:space-between; width:100%;
  padding:18px 20px; border:none; cursor:pointer;
  font-family:var(--font); font-size:17px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
}
.btn-primary{ background:var(--accent); color:#fff; }
.btn-primary:hover{ background:var(--accent-600); }
.btn-outline{ background:transparent; color:var(--text); border:2px solid var(--n300); justify-content:center;}
.btn-outline:hover{ border-color:var(--text); }
.btn-dark{ background:var(--text); color:var(--bg); }
.btn-dark:hover{ background:var(--n800); }

/* SESSION TOP BAR */
.sess-top{
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 0; border-bottom:2px solid var(--divider);
}
.exit-link{
  border:none; background:none; padding:0; cursor:pointer;
  font-family:var(--font); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--n600); font-weight:600;
}
.exit-link:hover{ color:var(--accent); }
.sess-meta{ display:flex; gap:20px; align-items:baseline; }
.sess-meta p{ margin:0; }
.sess-label{ font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.sess-clock{ font-family:var(--font); font-size:20px; font-weight:800; letter-spacing:.02em;}

.progress-track{ height:6px; background:var(--n200); }
.progress-fill{ height:100%; background:var(--accent); transform-origin:left; transition:width .45s cubic-bezier(.2,.8,.2,1);}

/* LIFTING STAGE */
.stage{ animation: stageIn .34s cubic-bezier(.2,.8,.2,1) both; }
@keyframes stageIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
.stage.slide-fwd{ animation: slideFwd .38s cubic-bezier(.2,.8,.2,1) both; }
@keyframes slideFwd{ from{opacity:0; transform:translateX(28px);} to{opacity:1; transform:none;} }
.stage.slide-back{ animation: slideBack .34s cubic-bezier(.2,.8,.2,1) both; }
@keyframes slideBack{ from{opacity:0; transform:translateX(-28px);} to{opacity:1; transform:none;} }

.stage-head{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:end;
  padding:22px 0 18px; border-bottom:2px solid var(--divider);
}
.stage-eyebrow{ margin:0 0 8px; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent-700); font-weight:700;}
.stage-name{ margin:0; font-family:var(--font); font-size:min(40px,9vw); line-height:.98; letter-spacing:-.015em; text-transform:uppercase; font-weight:800;}
.stage-scheme{ margin:0; font-family:var(--font); font-size:26px; font-weight:700; white-space:nowrap;}

.stage-visual{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,190px); border-bottom:2px solid var(--divider);}
.stage-art{ display:flex; align-items:center; justify-content:center; padding:20px 0; background:var(--n100);}
.stage-muscle{ display:flex; gap:14px; align-items:center; padding:20px 0 20px 20px; border-left:2px solid var(--divider);}
.stage-muscle .mlabel{ margin:0 0 4px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.stage-muscle .mname{ margin:0; font-family:var(--font); font-size:16px; font-weight:700; text-transform:uppercase; line-height:1.15;}

.cue{ display:grid; grid-template-columns:32px 1fr; gap:12px; padding:14px 0; border-bottom:2px solid var(--divider);}
.cue-n{ margin:0; font-family:var(--font); font-size:13px; font-weight:800; color:var(--accent);}
.cue-text{ margin:0; font-size:14.5px; line-height:1.45; color:var(--n800);}

.set-row{ display:flex; justify-content:space-between; align-items:center; padding:20px 0;}
.set-dots{ display:flex; gap:8px; flex-wrap:wrap;}
.set-dot{
  width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font); font-size:15px; font-weight:700; border:2px solid var(--n300); color:var(--n500);
  transition: transform .15s ease;
}
.set-dot.filled{ background:var(--accent); color:#fff; border-color:var(--accent);}
.set-dot.current{ border-color:var(--text); color:var(--text);}
.set-dot.pop{ animation: dotPop .35s cubic-bezier(.34,1.56,.64,1); }
@keyframes dotPop{ 0%{transform:scale(1);} 45%{transform:scale(1.28);} 100%{transform:scale(1);} }
.sets-line{ margin:0; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--n600); font-weight:600;}

.stage-actions{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px;}

/* REST SCREEN */
.rest{ animation: stageIn .34s cubic-bezier(.2,.8,.2,1) both; padding:26px 0 0;}
.rest-banner{ background:var(--accent); color:#fff; padding:28px 26px 26px; transition:background .3s ease;}
.rest-banner.urgent{ background:var(--accent-700); animation: restPulse 1s ease-in-out infinite;}
@keyframes restPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.015);} }
.rest-eyebrow{ margin:0 0 4px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; opacity:.8; font-weight:700;}
.rest-clock{ margin:0; font-family:var(--font); font-size:min(112px,26vw); line-height:.86; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums;}
.rest-track{ height:6px; background:rgba(255,255,255,.3); margin:22px 0 0;}
.rest-fill{ height:100%; background:#fff; transition:width 1s linear;}
.rest-next{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center; padding:18px 0; border-bottom:2px solid var(--divider);}
.rest-next-label{ margin:0 0 4px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.rest-next-name{ margin:0; font-family:var(--font); font-size:22px; font-weight:700; text-transform:uppercase; line-height:1.1;}
.rest-next-clock{ margin:0; font-family:var(--font); font-size:20px; font-weight:800;}
.rest-actions{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding-top:20px;}

/* FINISHED SCREEN */
.finished{ animation: finIn .5s cubic-bezier(.2,.8,.2,1) both; padding:30px 0 0;}
@keyframes finIn{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:none;} }
.fin-banner{
  background:var(--accent); color:#fff; padding:34px 26px;
  transform-origin:left; animation: finBanner .5s cubic-bezier(.2,.8,.2,1) both .1s;
}
@keyframes finBanner{ from{transform:scaleX(0);} to{transform:scaleX(1);} }
.fin-eyebrow{ margin:0 0 10px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; opacity:.85; font-weight:700;}
.fin-title{ margin:0; font-family:var(--font); font-size:min(64px,13vw); line-height:.9; letter-spacing:-.03em; text-transform:uppercase; font-weight:800;}
.fin-stats{ display:grid; grid-template-columns:repeat(3,1fr);}
.fin-stat{ padding:22px 0; border-bottom:2px solid var(--divider);}
.fin-stat + .fin-stat{ padding-left:20px; border-left:2px solid var(--divider);}
.fin-stat-label{ margin:0 0 4px; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--n600); font-weight:600;}
.fin-stat-val{ margin:0; font-family:var(--font); font-size:32px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
.fin-copy{ margin:24px 0 26px; font-size:14px; line-height:1.5; color:var(--n700); max-width:44ch;}

/* ILLUSTRATIONS */
.ill{ width:100%; display:flex; }
.ill svg{ width:100%; height:auto; overflow:visible; }
.ill path{ fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; }
.ill circle{ fill:currentColor; }
.ill .sil{ color:var(--text); }
.ill .gh{ color:var(--n300); }
.ill .trunk{ stroke-width:21; }
.ill .thigh{ stroke-width:16; }
.ill .shin{ stroke-width:13; }
.ill .uarm{ stroke-width:12; }
.ill .farm{ stroke-width:10; }
.ill .kb{ color:var(--accent); }
.ill .gh .kb{ color:var(--n300); }
.ill .kb .bar{ stroke-width:5; }
.ill .arc{ color:var(--accent); stroke-width:3.5; stroke-dasharray:9 7; animation: flow 1.1s linear infinite; }
.ill .arw{ color:var(--accent); stroke-width:3; }
.ill .gnd{ stroke:var(--n300); stroke-width:2; }
@keyframes flow{ to{ stroke-dashoffset:-32; } }
@keyframes fr{ 0%,8.1%{opacity:1} 8.4%,100%{opacity:0} }
.ill .fr{ opacity:0; animation: fr 1.7s linear infinite; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Once a week / no machines</p>
      <h1>The Foundry</h1>
    </div>
    <p class="datestamp" id="dateStamp">—</p>
  </header>
  <div id="main"></div>
</div>

<div class="sticky-cta" id="stickyCta">
  <div class="sticky-cta-inner">
    <button class="btn btn-primary" id="startBtn"><span id="startLabel">Start session</span><span>→</span></button>
  </div>
</div>

<script>
// ---- EXERCISE DATA (poses ported from the Modernist illustration pass) ----
const EX = [
  {name:"Kettlebell Swing",sets:4,reps:"15 reps",muscle:"Glutes / Hamstrings",video:"https://www.youtube.com/watch?v=1Qi0NQW89Oc",cues:["Hinge at the hips — this is not a squat.","Snap the hips hard; the arms only steer.","Bell floats to chest height, no higher."],pose:{dur:1.5,ghost:{neck:[52,62],hip:[72,86],sh:[54,64],head:[44,52],legs:[[[66,110],[62,131]],[[84,108],[88,131]]],arms:[[[62,82],[66,98]]],bell:[66,104]},solid:{neck:[64,44],hip:[66,86],sh:[66,48],head:[62,30],legs:[[[58,108],[56,131]],[[74,108],[78,131]]],arms:[[[80,52],[96,56]]],bell:[102,58]},arc:"M74 104 A 48 48 0 0 1 106 62",arrow:"M100 67 L108 61 L103 53"}},
  {name:"Goblet Squat",sets:3,reps:"12 reps",muscle:"Quads",video:"https://www.youtube.com/watch?v=sIX71MwChNg",cues:["Hold the bell at the chest by the horns.","Elbows slide inside the knees at the bottom.","Drive through the whole foot, chest tall."],pose:{dur:2.2,ghost:{neck:[64,44],hip:[66,82],sh:[64,48],head:[62,30],legs:[[[62,106],[58,131]],[[76,106],[80,131]]],arms:[[[54,60],[64,56]],[[76,60],[68,56]]],bell:[66,58]},solid:{neck:[62,66],hip:[66,98],sh:[62,70],head:[58,52],legs:[[[46,104],[54,131]],[[86,104],[80,131]]],arms:[[[52,82],[62,78]],[[76,82],[68,78]]],bell:[65,80]},arc:"M110 54 L110 90",arrow:"M104 84 L110 93 L116 84"}},
  {name:"Single-Arm Row",sets:3,reps:"10 / side",muscle:"Back / Lats",video:"https://www.youtube.com/watch?v=uQZZdGF16KQ",cues:["Flat back, hinged forward, free hand braced.","Pull the elbow straight back, squeeze the blade.","Control the lowering — don't drop it."],pose:{dur:1.5,extra:'<rect x="14" y="88" width="28" height="6" fill="var(--n300)"/>',ghost:{neck:[48,60],hip:[80,84],sh:[50,62],head:[38,48],legs:[[[78,106],[74,131]],[[90,104],[94,131]]],arms:[[[36,74],[26,86]],[[52,80],[52,98]]],bell:[52,104]},solid:{neck:[48,60],hip:[80,84],sh:[50,62],head:[38,48],legs:[[[78,106],[74,131]],[[90,104],[94,131]]],arms:[[[36,74],[26,86]],[[68,72],[58,74]]],bell:[58,82]},arc:"M66 102 L66 80",arrow:"M60 86 L66 77 L72 86"}},
  {name:"Overhead Press",sets:3,reps:"8 / side",muscle:"Shoulders",video:"https://www.youtube.com/watch?v=gjr-QAdsq4o",cues:["Start racked at the shoulder, elbow in front.","Press straight up, ribs down, no lean back.","Lock out with the bicep near the ear."],pose:{dur:2,ghost:{neck:[64,44],hip:[64,84],sh:[66,48],head:[62,30],legs:[[[58,106],[56,131]],[[72,106],[76,131]]],arms:[[[78,60],[64,50]],[[52,60],[50,76]]],bell:[64,42]},solid:{neck:[64,44],hip:[64,84],sh:[66,48],head:[62,30],legs:[[[58,106],[56,131]],[[72,106],[76,131]]],arms:[[[74,34],[74,20]],[[52,60],[50,76]]],bell:[74,12]},arc:"M98 52 L98 20",arrow:"M92 26 L98 17 L104 26"}},
  {name:"Turkish Get-Up",sets:3,reps:"2–3 / side",muscle:"Full-body core",video:"https://www.youtube.com/watch?v=lpltjWHd0ek",cues:["Slow and technical — this is the point, not a race.","Eyes on the bell for the entire rep.","Stand tall, then reverse it just as carefully."],pose:{dur:3.2,ghost:{neck:[50,118],hip:[86,120],sh:[52,116],head:[38,116],legs:[[[100,112],[112,126]],[[98,124],[112,130]]],arms:[[[54,96],[54,76]],[[46,126],[36,128]]],bell:[54,68]},solid:{neck:[62,66],hip:[64,100],sh:[62,70],head:[58,52],legs:[[[44,100],[40,130]],[[86,116],[104,126]]],arms:[[[70,52],[72,34]],[[50,86],[36,120]]],bell:[72,26]},arc:"M42 124 A 46 46 0 0 1 76 98",arrow:"M69 94 L78 98 L71 105"}},
  {name:"Windmill Finisher",sets:2,reps:"10 / side",muscle:"Obliques",video:"https://www.youtube.com/watch?v=1N1Qs9FO4GU",cues:["Bell locked overhead, hinge toward the opposite foot.","Keep the loaded arm vertical the whole way down.","Optional — the first five lifts matter more."],pose:{dur:1.9,ghost:{neck:[70,46],hip:[70,86],sh:[70,50],head:[68,32],legs:[[[60,108],[56,131]],[[82,108],[86,131]]],arms:[[[84,36],[94,22]],[[58,66],[56,84]]],bell:[96,14]},solid:{neck:[56,64],hip:[72,84],sh:[58,66],head:[46,52],legs:[[[58,108],[52,131]],[[92,106],[98,131]]],arms:[[[76,48],[92,32]],[[46,86],[44,110]]],bell:[96,24]},arc:"M86 44 A 46 46 0 0 0 54 84",arrow:"M47 77 L52 86 L61 82"}}
];
const PT = a => a[0]+' '+a[1];
function limbs(j){
  let s = '<path class="trunk" d="M'+PT(j.neck)+' L'+PT(j.hip)+'"/>';
  (j.legs||[]).forEach(l => { s += '<path class="thigh" d="M'+PT(j.hip)+' L'+PT(l[0])+'"/><path class="shin" d="M'+PT(l[0])+' L'+PT(l[1])+'"/>'; });
  (j.arms||[]).forEach(a => { s += '<path class="uarm" d="M'+PT(j.sh)+' L'+PT(a[0])+'"/><path class="farm" d="M'+PT(a[0])+' L'+PT(a[1])+'"/>'; });
  s += '<circle cx="'+j.head[0]+'" cy="'+j.head[1]+'" r="10"/>';
  if(j.bell) s += '<g class="kb"><path class="bar" d="M'+(j.bell[0]-7)+' '+(j.bell[1]-7)+' q7 -11 14 0"/><circle cx="'+j.bell[0]+'" cy="'+(j.bell[1]+3)+'" r="9"/></g>';
  return s;
}
const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
function mix(g,s,t){
  const o = {neck:lerp(g.neck,s.neck,t), hip:lerp(g.hip,s.hip,t), sh:lerp(g.sh,s.sh,t), head:lerp(g.head,s.head,t)};
  o.legs = (s.legs||[]).map((l,i)=> l.map((pt,k)=> lerp((g.legs[i]||l)[k], pt, t)));
  o.arms = (s.arms||[]).map((a,i)=> a.map((pt,k)=> lerp((g.arms[i]||a)[k], pt, t)));
  if(s.bell) o.bell = lerp(g.bell||s.bell, s.bell, t);
  return o;
}
const TS = [0,1/6,2/6,3/6,4/6,5/6,1,5/6,4/6,3/6,2/6,1/6];
function art(p, compact){
  const d = (p.dur || 1.7) * 2;
  let frames = '';
  TS.forEach((t,i)=>{
    frames += '<g class="sil fr" style="animation-duration:'+d+'s;animation-delay:'+(d*i/TS.length).toFixed(3)+'s">'+limbs(mix(p.ghost,p.solid,t))+'</g>';
  });
  return '<line class="gnd" x1="16" y1="133" x2="114" y2="133"/>' + (p.extra||'')
    + (compact ? '' : '<g class="gh">'+limbs(p.ghost)+'</g>')
    + frames
    + (p.arc ? '<path class="arc" d="'+p.arc+'"/>' : '')
    + (p.arrow ? '<path class="arw" d="'+p.arrow+'"/>' : '');
}
function svgWrap(inner){
  return `<div class="ill"><svg viewBox="0 0 130 140"><g>${inner}</g></svg></div>`;
}
const ZONES = {
  "Glutes / Hamstrings":[[30,58,11,7],[23,72,4.5,12],[37,72,4.5,12]],
  "Quads":[[23,70,4.5,13],[37,70,4.5,13]],
  "Back / Lats":[[30,30,10,14]],
  "Shoulders":[[12,20,6,7],[48,20,6,7]],
  "Full-body core":[[30,44,7,11],[12,20,6,7],[48,20,6,7]],
  "Obliques":[[22,42,4.5,10],[38,42,4.5,10]]
};
function bodyDiagram(muscle){
  const base = '<circle cx="30" cy="8" r="7"/><rect x="21" y="16" width="18" height="38"/><rect x="9" y="18" width="8" height="30"/><rect x="43" y="18" width="8" height="30"/><rect x="20" y="53" width="8" height="44"/><rect x="32" y="53" width="8" height="44"/>';
  const hl = (ZONES[muscle]||[]).map(z=>`<ellipse cx="${z[0]}" cy="${z[1]}" rx="${z[2]}" ry="${z[3]}"/>`).join('');
  return `<div style="width:54px;flex:none;display:flex;"><svg viewBox="0 0 60 110" style="width:100%"><g fill="var(--n300)">${base}</g><g fill="var(--accent)">${hl}</g></svg></div>`;
}

// ---- STATE ----
const state = {
  view:'overview', ex:0,
  sets:new Array(EX.length).fill(0),
  done:new Array(EX.length).fill(false),
  resting:false, restLeft:0, restTotal:0, restNext:'',
  secs:0, lastPoppedDot:-1
};
let clockTimer = null;

function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'); }

function startClock(){
  if(clockTimer) return;
  clockTimer = setInterval(()=>{
    if(state.view !== 'session') return;
    state.secs++;
    if(state.resting){
      if(state.restLeft <= 1){ state.resting = false; state.restLeft = 0; render(); }
      else { state.restLeft--; updateRestClockOnly(); }
    } else {
      updateSessionClockOnly();
    }
  },1000);
}

function updateRestClockOnly(){
  const clockEl = document.getElementById('restClockVal');
  const fillEl = document.getElementById('restFillVal');
  const bannerEl = document.getElementById('restBannerEl');
  if(clockEl) clockEl.textContent = fmt(state.restLeft);
  if(fillEl) fillEl.style.width = (state.restTotal ? (1 - state.restLeft/state.restTotal)*100 : 0).toFixed(1)+'%';
  const topClock = document.getElementById('sessClockVal');
  if(topClock) topClock.textContent = fmt(state.secs);
  const nextClock = document.getElementById('restNextClockVal');
  if(nextClock) nextClock.textContent = fmt(state.secs);
  if(bannerEl){
    if(state.restLeft <= 10 && state.restLeft > 0) bannerEl.classList.add('urgent');
    else bannerEl.classList.remove('urgent');
  }
}
function updateSessionClockOnly(){
  const topClock = document.getElementById('sessClockVal');
  if(topClock) topClock.textContent = fmt(state.secs);
}

function beginRest(sec, label){
  state.resting = true; state.restLeft = sec; state.restTotal = sec; state.restNext = label;
}

function logSet(){
  const ex = EX[state.ex];
  state.sets[state.ex]++;
  state.lastPoppedDot = state.sets[state.ex]-1;
  if(state.sets[state.ex] >= ex.sets){
    state.done[state.ex] = true;
    const nx = state.ex + 1;
    if(nx >= EX.length){ state.view = 'finished'; state.resting = false; render(); return; }
    state.ex = nx;
    beginRest(90, EX[nx].name);
  } else {
    beginRest(60, ex.name + ' — set ' + (state.sets[state.ex]+1));
  }
  render();
}
function skipLift(){
  state.done[state.ex] = true;
  const nx = state.ex + 1;
  if(nx >= EX.length){ state.view = 'finished'; state.resting = false; render(); return; }
  state.ex = nx; state.resting = false;
  render('fwd');
}
function skipRest(){ state.resting = false; state.restLeft = 0; render(); }
function addRest(){ state.restLeft += 15; state.restTotal += 15; updateRestClockOnly(); }
function startSession(){ state.view = 'session'; startClock(); render('fwd'); }
function goToHowTo(){ state.view = 'howto'; render(); }
function exitToOverview(){ state.view = 'overview'; render('back'); }
function resetAll(){
  state.view='overview'; state.ex=0;
  state.sets = new Array(EX.length).fill(0);
  state.done = new Array(EX.length).fill(false);
  state.secs=0; state.resting=false;
  render();
}

// ---- RENDER ----
function renderOverview(){
  const doneCount = state.done.filter(Boolean).length;
  const totalSets = EX.reduce((a,e)=>a+e.sets,0);
  const doneSets = state.sets.reduce((a,b)=>a+b,0);
  const rows = EX.map((e,i)=>{
    const isDone = state.done[i];
    const inProgress = state.sets[i] > 0 && !isDone;
    const stateColor = isDone ? 'var(--accent)' : 'var(--n600)';
    const numColor = isDone ? 'var(--accent)' : 'var(--n500)';
    const stateText = isDone ? 'Done' : (inProgress ? state.sets[i]+'/'+e.sets : '');
    return `<div class="row" style="animation-delay:${i*55}ms">
      <p class="row-num" style="color:${numColor}">${String(i+1).padStart(2,'0')}</p>
      <div class="row-art">${svgWrap(art(e.pose, true))}</div>
      <div>
        <p class="row-name">${e.name}</p>
        <p class="row-scheme">${e.sets} × ${e.reps}</p>
        <span class="tag-outline">${e.muscle}</span>
      </div>
      <p class="row-state" style="color:${stateColor}">${stateText}</p>
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="stat-row">
      <div class="stat"><p class="stat-label">Lifts done</p><p class="stat-val">${doneCount}<small>/${EX.length}</small></p></div>
      <div class="stat"><p class="stat-label">Duration</p><p class="stat-val">45<small> min</small></p></div>
      <div class="stat"><p class="stat-label">Load</p><p class="stat-val">${totalSets}<small> sets</small></p></div>
    </div>
    <p class="section-label">The order</p>
    ${rows}
    <hr class="hr">
    <p class="footnote">Rest 60s between sets, 90s between lifts. Cardio and push volume are handled separately — this session is hinge, squat, pull, press, carry.</p>
    <button class="howto-link" id="howtoLink"><span>▶</span><span>How to do these — video guide</span></button>
  `;
  document.getElementById('startLabel').textContent = doneSets > 0 ? 'Resume session' : 'Start session';
  document.getElementById('stickyCta').classList.remove('hidden');
  document.getElementById('howtoLink').addEventListener('click', goToHowTo);
}

function renderSessionLifting(transitionClass){
  const ex = EX[state.ex];
  const totalSets = EX.reduce((a,e)=>a+e.sets,0);
  const doneSets = state.sets.reduce((a,b)=>a+b,0);
  const cuesHtml = ex.cues.map((c,i)=>`<div class="cue"><p class="cue-n">${i+1}</p><p class="cue-text">${c}</p></div>`).join('');
  const dotsHtml = Array.from({length:ex.sets},(_,i)=>{
    const filled = i < state.sets[state.ex];
    const current = i === state.sets[state.ex];
    const pop = (i === state.lastPoppedDot) ? ' pop' : '';
    return `<div class="set-dot${filled?' filled':''}${current?' current':''}${pop}">${filled?'✓':(i+1)}</div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="sess-top">
      <button class="exit-link" id="exitBtn">← Overview</button>
      <div class="sess-meta">
        <p class="sess-label">${doneSets}/${totalSets} sets</p>
        <p class="sess-clock" id="sessClockVal">${fmt(state.secs)}</p>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${(doneSets/totalSets*100).toFixed(1)}%"></div></div>

    <div class="stage ${transitionClass||''}">
      <div class="stage-head">
        <div>
          <p class="stage-eyebrow">Lift ${state.ex+1} of ${EX.length}</p>
          <h2 class="stage-name">${ex.name}</h2>
        </div>
        <p class="stage-scheme">${ex.sets} × ${ex.reps}</p>
      </div>
      <div class="stage-visual">
        <div class="stage-art">${svgWrap(art(ex.pose, false))}</div>
        <div class="stage-muscle">
          ${bodyDiagram(ex.muscle)}
          <div>
            <p class="mlabel">Primary</p>
            <p class="mname">${ex.muscle}</p>
          </div>
        </div>
      </div>
      ${cuesHtml}
      <div class="set-row">
        <div class="set-dots">${dotsHtml}</div>
        <p class="sets-line">${state.sets[state.ex]} of ${ex.sets} sets logged</p>
      </div>
      <div class="stage-actions">
        <button class="btn btn-primary" id="logSetBtn"><span>Log set</span><span>✓</span></button>
        <button class="btn btn-outline" id="skipBtn">Skip lift</button>
      </div>
    </div>
  `;
  document.getElementById('exitBtn').addEventListener('click', exitToOverview);
  document.getElementById('logSetBtn').addEventListener('click', logSet);
  document.getElementById('skipBtn').addEventListener('click', skipLift);
  state.lastPoppedDot = -1;
}

function renderSessionResting(){
  const totalSets = EX.reduce((a,e)=>a+e.sets,0);
  const doneSets = state.sets.reduce((a,b)=>a+b,0);
  const urgent = state.restLeft <= 10 && state.restLeft > 0;
  document.getElementById('main').innerHTML = `
    <div class="sess-top">
      <button class="exit-link" id="exitBtn">← Overview</button>
      <div class="sess-meta">
        <p class="sess-label">${doneSets}/${totalSets} sets</p>
        <p class="sess-clock" id="sessClockVal">${fmt(state.secs)}</p>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${(doneSets/totalSets*100).toFixed(1)}%"></div></div>

    <div class="rest">
      <div class="rest-banner${urgent?' urgent':''}" id="restBannerEl">
        <p class="rest-eyebrow">Rest</p>
        <p class="rest-clock" id="restClockVal">${fmt(state.restLeft)}</p>
        <div class="rest-track"><div class="rest-fill" id="restFillVal" style="width:${(state.restTotal ? (1 - state.restLeft/state.restTotal)*100 : 0).toFixed(1)}%"></div></div>
      </div>
      <div class="rest-next">
        <div>
          <p class="rest-next-label">Up next</p>
          <p class="rest-next-name">${state.restNext}</p>
        </div>
        <p class="rest-next-clock" id="restNextClockVal">${fmt(state.secs)}</p>
      </div>
      <div class="rest-actions">
        <button class="btn btn-outline" id="addRestBtn">+15s</button>
        <button class="btn btn-dark" id="skipRestBtn"><span>Skip rest</span><span>→</span></button>
      </div>
    </div>
  `;
  document.getElementById('exitBtn').addEventListener('click', exitToOverview);
  document.getElementById('addRestBtn').addEventListener('click', addRest);
  document.getElementById('skipRestBtn').addEventListener('click', skipRest);
}

function renderFinished(){
  const doneCount = state.done.filter(Boolean).length;
  const doneSets = state.sets.reduce((a,b)=>a+b,0);
  document.getElementById('main').innerHTML = `
    <div class="finished">
      <div class="fin-banner">
        <p class="fin-eyebrow">Session complete</p>
        <h2 class="fin-title">Week<br>logged.</h2>
      </div>
      <div class="fin-stats">
        <div class="fin-stat"><p class="fin-stat-label">Total time</p><p class="fin-stat-val">${fmt(state.secs)}</p></div>
        <div class="fin-stat"><p class="fin-stat-label">Lifts</p><p class="fin-stat-val">${doneCount}</p></div>
        <div class="fin-stat"><p class="fin-stat-label">Volume</p><p class="fin-stat-val">${doneSets} sets</p></div>
      </div>
      <p class="fin-copy">One session a week, done. Next one in seven days — same order, add load where the last set felt easy.</p>
      <button class="btn btn-outline" id="restartBtn" style="border-color:var(--text)"><span>Back to overview</span><span>→</span></button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', resetAll);
  document.getElementById('stickyCta').classList.add('hidden');
}

function renderHowTo(){
  const rows = EX.map((e,i)=>{
    return `<a class="video-row" href="${e.video}" target="_blank" rel="noopener noreferrer" style="animation-delay:${i*55}ms">
      <p class="row-num">${String(i+1).padStart(2,'0')}</p>
      <div class="video-row-art">${svgWrap(art(e.pose, true))}</div>
      <div>
        <p class="video-row-name">${e.name}</p>
        <p class="video-row-sub">Tutorial on YouTube ↗</p>
      </div>
      <div class="video-row-play">▶</div>
    </a>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="sess-top">
      <button class="exit-link" id="howtoBackBtn">← Overview</button>
    </div>
    <p class="section-label" style="margin-top:20px">Video guide</p>
    ${rows}
    <hr class="hr">
    <p class="footnote">One tutorial per movement — links open on YouTube. Form matters more than load on all six.</p>
  `;
  document.getElementById('howtoBackBtn').addEventListener('click', exitToOverview);
  document.getElementById('stickyCta').classList.add('hidden');
}

function render(transitionClass){
  if(state.view === 'overview'){
    renderOverview();
  } else if(state.view === 'howto'){
    renderHowTo();
  } else if(state.view === 'session'){
    document.getElementById('stickyCta').classList.add('hidden');
    if(state.resting) renderSessionResting();
    else renderSessionLifting(transitionClass === 'fwd' ? 'slide-fwd' : (transitionClass === 'back' ? 'slide-back' : ''));
  } else if(state.view === 'finished'){
    renderFinished();
  }
}

document.getElementById('startBtn').addEventListener('click', startSession);
document.getElementById('dateStamp').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });

render();
</script>
</body>
</html>
